[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat"
version = "1.0.0"
description = "Chat with any SQL database and get charts: a standalone AI chart chat."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5",
    "sqlglot>=20",
    "pyyaml>=6",
    "redis>=5",
    "celery>=5.3",
    "cryptography>=42",
    "openai>=1.30",
    "anthropic>=0.40",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
mssql = ["pymssql>=2.3"]
duckdb = ["duckdb-engine>=0.11"]
snowflake = ["snowflake-sqlalchemy>=1.5"]
bigquery = ["sqlalchemy-bigquery>=1.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["ai_chat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "UP007", "UP045", "B008"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
known-first-party = ["ai_chat"]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"ai_chat/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
