server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # Re-resolve "api" through Docker's DNS so a recreated api container (new IP)
    # does not leave the proxy answering 502 until nginx restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Hashed file names: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/charts/…, /dashboards/…) all load the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
