# Database connections managed by configuration. They are synced into the app on
# every start (matched by name) and cannot be deleted from the UI. Users can also
# add connections from the UI unless AI_CHAT_ALLOW_UI_CONNECTIONS=false.
#
#   name:    shown in the UI (and matched against semantics `database_name`)
#   uri:     SQLAlchemy URI; use a read-only database user
#   schemas: optional allow-list of schemas users may chat about
#
# Inside Docker, reach a database on your machine at host.docker.internal.

databases:
  # The sample warehouse started by `docker compose --profile demo up`
  - name: Demo warehouse
    uri: postgresql+psycopg2://ai_chat_ro:ai_chat_ro_secret@demo-warehouse:5432/warehouse
    schemas: [wh]

  # Examples:
  # - name: Sales (Postgres)
  #   uri: postgresql+psycopg2://readonly:secret@host.docker.internal:5432/sales
  #   schemas: [public]
  # - name: Shop (MySQL)
  #   uri: mysql+pymysql://readonly:secret@mysql.internal:3306/shop
